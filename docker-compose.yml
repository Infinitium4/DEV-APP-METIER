services:
  db:
    image: mariadb:11.8
    container_name: ma-bdd
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ma_database
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
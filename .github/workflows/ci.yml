name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          docker run --rm -v "$PWD":/app -w /app python:3.12-slim \
            sh -c "pip install -q -r requirements.txt pytest && pytest tests/unit -v"
